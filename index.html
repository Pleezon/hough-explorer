<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Hough Space</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Interactive Hough Transform Explorer</h1>
  </header>

  <main class="layout">
    <section class="left">
      <div class="panel">
        <h2>Point Plane (click or drag to add points)</h2>
        <div class="toolbar">
          <button id="undoBtn" title="Undo last action">Undo</button>
          <button id="clearBtn" title="Clear all points">Clear</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="pointsCanvas" width="400" height="400"></canvas>
        </div>
      </div>

      <div class="panel">
        <h2>Hough Space</h2>
        <div class="toolbar">
        </div>
        <div class="canvas-wrap dark">
          <canvas id="houghCanvas" width="400" height="400"></canvas>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="panel code">
        <h2>Editable Transform Code</h2>
        <div class="code-toolbar">
          <button id="resetCodeBtn">Reset</button>
          <span id="codeStatus" class="badge">Ready</span>
        </div>
        <div id="codeEditor" class="editor"></div>
      </div>
    </section>
  </main>

  <!-- Monaco Editor loader (VS Code's editor) -->
  <script>
    window.require = window.require || {};
    window.require.paths = { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
